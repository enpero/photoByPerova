<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5f4fc">
  <title>Photo by Perova</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #e5f4fc; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 15% 12%, #ffffffed 0%, #ffffff00 48%),
        radial-gradient(ellipse at 88% 76%, #a9d6f580 0%, #a9d6f500 53%),
        linear-gradient(135deg, #eaf7fd 0%, #dceffb 50%, #edf8ff 100%);
    }
    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(22px, 5vw, 80px);
      overflow: hidden;
    }
    .scene::before, .scene::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }
    .scene::before {
      width: min(58vw, 760px);
      aspect-ratio: 1;
      top: -16%;
      right: -9%;
      background: radial-gradient(circle at 35% 32%, #ffffffdc, #b9def185 56%, #97c9ef24);
      box-shadow: inset 2px 2px 45px #ffffffaa, 0 28px 95px #9bc9e52b;
    }
    .scene::after {
      width: min(47vw, 620px);
      aspect-ratio: 1;
      bottom: -24%;
      left: -8%;
      background: radial-gradient(circle at 38% 28%, #f8fdff, #bbdcf59c 62%, #a8d6f152);
      box-shadow: 0 0 100px #add7f15c;
    }
    .glass {
      width: 100%;
      min-height: calc(100svh - clamp(44px, 10vw, 160px));
      border-radius: clamp(24px, 3vw, 48px);
      border: 1px solid #ffffffbf;
      background: linear-gradient(120deg, #ffffff47, #d5edfc24 48%, #f4fbff40);
      -webkit-backdrop-filter: blur(32px) saturate(115%);
      backdrop-filter: blur(32px) saturate(115%);
      box-shadow:
        inset 0 1px 0 #ffffffeb,
        inset 1px 0 0 #ffffff80,
        inset 0 -1px 0 #b8daef59,
        0 25px 90px #739db91c,
        0 4px 18px #83aec511;
    }
    @media (max-width: 600px) {
      .scene::before { width: 95vw; top: -5%; right: -40%; }
      .scene::after { width: 90vw; bottom: -10%; left: -40%; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="glass"></div></div>
</body>
</html>
