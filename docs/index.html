  <dialog class="album" id="album" aria-label="Просмотр фотоальбома">
    <div class="album-stage" id="album-stage">
      <figure class="album-glass">
        <img class="album-photo" id="album-photo" alt="" draggable="false">
      </figure>
    </div>
    <button class="album-control album-close" type="button" aria-label="Закрыть просмотр" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <button class="album-control album-prev" type="button" aria-label="Предыдущее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
    <button class="album-control album-next" type="button" aria-label="Следующее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
  </dialog>
  <script>
    // Retire the saved manual layout choice; responsive CSS follows the screen.
    try { localStorage.removeItem('perova-device-view'); } catch {}
  </script>
  <script>
    const gallery = document.querySelector('.gallery');
    const viewButtons = [...document.querySelectorAll('.view-button')];
    function setGalleryView(view) {
      const selected = view === 'squares' ? 'squares' : 'original';
      gallery.dataset.view = selected;
      viewButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === selected)));
      try { localStorage.setItem('perova-gallery-view', selected); } catch {}
    }
    let savedView = 'original';
    try { savedView = localStorage.getItem('perova-gallery-view') || 'original'; } catch {}
    setGalleryView(savedView);
    viewButtons.forEach(button => button.addEventListener('click', () => setGalleryView(button.dataset.view)));
    const frames = [...document.querySelectorAll('.frame')];
    const filterButtons = [...document.querySelectorAll('.filter-button')];
    const emptyGallery = document.getElementById('empty-gallery');
    let selectedCategory = 'all';
    const orderedFrames = shufflePhotos(frames);
    gallery.append(...orderedFrames);
    let activeFrames = [...frames];
    function matchesCategory(tags, category) {
      return category === 'all' || tags.includes(category);
    }
    function shufflePhotos(list, random = Math.random) {
      const result = [...list];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      // Keep the initial gallery out of upload order, even if the shuffle matches it.
      if (result.length > 1 && result.every((value, i) => value === list[i])) result.push(result.shift());
      return result;
    }
    function applyFilters() {
      activeFrames = orderedFrames.filter(frame => matchesCategory(frame.dataset.tags.split(','), selectedCategory));
      const visible = new Set(activeFrames);
      orderedFrames.forEach(frame => { frame.hidden = !visible.has(frame); });
      filterButtons.forEach(button => button.setAttribute('aria-pressed', String(
        button.dataset.filter === selectedCategory
      )));
      emptyGallery.hidden = activeFrames.length !== 0;
    }
    filterButtons.forEach(button => button.addEventListener('click', () => {
      selectedCategory = button.dataset.filter;
      applyFilters();
    }));
    applyFilters();
    const album = document.getElementById('album');
    const photo = document.getElementById('album-photo');
    const stage = document.getElementById('album-stage');
    let current = 0;
    let origin = null;
    let touchStart = null;
    function showPhoto(index) {
      if (!activeFrames.length) return;
      current = (index + activeFrames.length) % activeFrames.length;
      const frame = activeFrames[current];
      photo.src = frame.href;
      photo.alt = frame.querySelector('img').alt;
      album.setAttribute('aria-label', 'Фотография ' + (current + 1) + ' из ' + activeFrames.length);
    }
    frames.forEach(frame => frame.addEventListener('click', event => {
      event.preventDefault();
      origin = frame;
      showPhoto(activeFrames.indexOf(frame));
      album.showModal();
      document.documentElement.classList.add('album-open');
    }));
    album.querySelector('.album-close').addEventListener('click', () => album.close());
    album.querySelector('.album-prev').addEventListener('click', () => showPhoto(current - 1));
    album.querySelector('.album-next').addEventListener('click', () => showPhoto(current + 1));
    album.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        showPhoto(current + (event.key === 'ArrowRight' ? 1 : -1));
      }
    });
    album.addEventListener('close', () => {
      document.documentElement.classList.remove('album-open');
      touchStart = null;
      if (origin) origin.focus({ preventScroll: true });
    });
    stage.addEventListener('click', event => {
      if (event.target === stage) album.close();
    });
    stage.addEventListener('touchstart', event => {
      touchStart = event.touches.length === 1
        ? { x: event.touches[0].clientX, y: event.touches[0].clientY }
        : null;
    }, { passive: true });
    stage.addEventListener('touchend', event => {
      if (!touchStart || event.touches.length || !event.changedTouches.length) return;
      const dx = event.changedTouches[0].clientX - touchStart.x;
      const dy = event.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        showPhoto(current + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });
    stage.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });
  </script>
