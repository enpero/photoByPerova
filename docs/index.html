<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5f4fc">
  <title>Photo by Perova</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #e5f4fc; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 15% 12%, #ffffffed 0%, #ffffff00 48%),
        radial-gradient(ellipse at 88% 76%, #a9d6f580 0%, #a9d6f500 53%),
        linear-gradient(135deg, #eaf7fd 0%, #dceffb 50%, #edf8ff 100%);
    }
    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(22px, 5vw, 80px);
      overflow: hidden;
    }
    .scene::before, .scene::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }
    .scene::before {
      width: min(58vw, 760px);
      aspect-ratio: 1;
      top: -16%;
      right: -9%;
      background: radial-gradient(circle at 35% 32%, #ffffffdc, #b9def185 56%, #97c9ef24);
      box-shadow: inset 2px 2px 45px #ffffffaa, 0 28px 95px #9bc9e52b;
    }
    .scene::after {
      width: min(47vw, 620px);
      aspect-ratio: 1;
      bottom: -24%;
      left: -8%;
      background: radial-gradient(circle at 38% 28%, #f8fdff, #bbdcf59c 62%, #a8d6f152);
      box-shadow: 0 0 100px #add7f15c;
    }
    .glass {
      width: 100%;
      min-height: calc(100svh - clamp(44px, 10vw, 160px));
      border-radius: clamp(24px, 3vw, 48px);
      border: 1px solid #ffffffbf;
      background: linear-gradient(120deg, #ffffff47, #d5edfc24 48%, #f4fbff40);
      -webkit-backdrop-filter: blur(32px) saturate(115%);
      backdrop-filter: blur(32px) saturate(115%);
      box-shadow:
        inset 0 1px 0 #ffffffeb,
        inset 1px 0 0 #ffffff80,
        inset 0 -1px 0 #b8daef59,
        0 25px 90px #739db91c,
        0 4px 18px #83aec511;
    }
    @media (max-width: 600px) {
      .scene::before { width: 95vw; top: -5%; right: -40%; }
      .scene::after { width: 90vw; bottom: -10%; left: -40%; }
    }
    .glass { padding: clamp(12px, 2.5vw, 36px); }
    .gallery { columns: 3; column-gap: clamp(12px, 2vw, 28px); }
    .frame {
      display: block;
      break-inside: avoid;
      margin: 0 0 clamp(12px, 2vw, 28px);
      border: 1px solid #ffffffb8;
      border-radius: 18px;
      overflow: hidden;
      background: #eef9ff52;
      box-shadow: 0 8px 25px #557e9820;
      transition: box-shadow .2s ease;
    }
    .frame:hover { box-shadow: 0 12px 35px #557e9840; }
    .frame:focus-visible { outline: 3px solid #5194c3; outline-offset: 5px; }
    .frame img { display: block; width: 100%; height: auto; image-orientation: from-image; }
    @media (max-width: 1000px) { .gallery { columns: 2; } }
    @media (max-width: 580px) { .gallery { columns: 1; } .frame { border-radius: 14px; } }
    @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
    html.album-open { overflow: hidden; }
    .album {
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: #e4f2fbf0;
      color: #315975;
      overflow: hidden;
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      overscroll-behavior: contain;
    }
    .album::backdrop { background: #b4d5e7a6; }
    .album-stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 65px 80px;
      touch-action: pan-y pinch-zoom;
    }
    .album-glass {
      --frame-padding: clamp(10px, 1.6vw, 24px);
      padding: var(--frame-padding);
      margin: 0;
      max-width: 100%;
      border: 1px solid #ffffffe0;
      border-radius: clamp(18px, 2.4vw, 34px);
      background: linear-gradient(135deg, #ffffff80, #b9dff747 48%, #effaff73);
      -webkit-backdrop-filter: blur(30px) saturate(125%);
      backdrop-filter: blur(30px) saturate(125%);
      box-shadow:
        inset 0 1px 0 #ffffff,
        inset 1px 0 0 #ffffffa6,
        inset 0 -1px 0 #93bdd366,
        0 24px 80px #365b7733,
        0 4px 18px #6d9ab521;
    }
    .album-photo {
      display: block;
      max-width: calc(100vw - 160px - 2 * var(--frame-padding) - 2px);
      max-height: calc(100dvh - 130px - 2 * var(--frame-padding) - 2px);
      width: auto;
      height: auto;
      object-fit: contain;
      image-orientation: from-image;
      border-radius: clamp(8px, 1.2vw, 16px);
      box-shadow: 0 2px 12px #365b771a;
    }
    .album-control {
      position: absolute;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid #ffffffd9;
      border-radius: 50%;
      background: #f5fbffb8;
      color: #315975;
      cursor: pointer;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: 0 4px 20px #365b771a;
    }
    .album-control:hover { background: #ffffffed; }
    .album-control:focus-visible { outline: 3px solid #5194c3; outline-offset: 4px; }
    .album-control svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .album-close { top: 16px; right: 18px; }
    .album-prev { top: calc(50% - 24px); left: 16px; }
    .album-next { top: calc(50% - 24px); right: 16px; }
    @media (max-width: 580px) {
      .album-stage { padding: 74px 12px 88px; }
      .album-glass {
      --frame-padding: clamp(10px, 1.6vw, 24px);
      padding: var(--frame-padding);
      margin: 0;
      max-width: 100%;
      border: 1px solid #ffffffe0;
      border-radius: clamp(18px, 2.4vw, 34px);
      background: linear-gradient(135deg, #ffffff80, #b9dff747 48%, #effaff73);
      -webkit-backdrop-filter: blur(30px) saturate(125%);
      backdrop-filter: blur(30px) saturate(125%);
      box-shadow:
        inset 0 1px 0 #ffffff,
        inset 1px 0 0 #ffffffa6,
        inset 0 -1px 0 #93bdd366,
        0 24px 80px #365b7733,
        0 4px 18px #6d9ab521;
    }
    .album-photo { max-height: calc(100dvh - 162px); }
      .album-prev { top: auto; bottom: 18px; left: calc(50% - 60px); }
      .album-next { top: auto; bottom: 18px; right: calc(50% - 60px); }
    }
    .view-switch {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: clamp(14px, 2vw, 24px);
    }
    .view-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 10px;
      border: 1px solid #ffffffc9;
      border-radius: 12px;
      background: #f3faff4d;
      color: #688ba3;
      cursor: pointer;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
    .view-button:hover { background: #ffffffa6; }
    .view-button[aria-pressed="true"] {
      background: #f9fdffcf;
      color: #315975;
      box-shadow: inset 0 1px 0 #fff, 0 3px 12px #557e981a;
      border-color: #b4d4e8;
    }
    .view-button:focus-visible { outline: 3px solid #5194c3; outline-offset: 3px; }
    .view-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; }
    .gallery[data-view="squares"] {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(8px, 1.1vw, 16px);
      columns: auto;
    }
    .gallery[data-view="squares"] .frame {
      margin: 0;
      aspect-ratio: 1;
      min-width: 0;
      border-radius: clamp(8px, 1.2vw, 16px);
    }
    .gallery[data-view="squares"] .frame img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 1000px) {
      .gallery[data-view="squares"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 580px) {
      .gallery[data-view="squares"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="glass">
      <div class="view-switch" role="group" aria-label="Вид галереи">
        <button class="view-button" type="button" data-view="original" aria-label="Исходная раскладка" title="Исходная раскладка" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="11" rx="1"/><rect x="14" y="3" width="7" height="6" rx="1"/><rect x="3" y="18" width="7" height="3" rx="1"/><rect x="14" y="13" width="7" height="8" rx="1"/></svg></button>
        <button class="view-button" type="button" data-view="squares" aria-label="Квадратная сетка" title="Квадратная сетка" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></svg></button>
      </div>
      <div class="gallery" data-view="original">
        <a class="frame" href="./photos/QAT_1365.jpeg" aria-label="Открыть фотографию 1" aria-haspopup="dialog"><img src="./photos/QAT_1365.jpeg" alt="Фотография 1" width="6048" height="4032" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/QAT_1463.jpeg" aria-label="Открыть фотографию 2" aria-haspopup="dialog"><img src="./photos/QAT_1463.jpeg" alt="Фотография 2" width="4032" height="6048" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/QAT_1468.JPG" aria-label="Открыть фотографию 3" aria-haspopup="dialog"><img src="./photos/QAT_1468.JPG" alt="Фотография 3" width="6048" height="4032" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/QAT_1527.jpeg" aria-label="Открыть фотографию 4" aria-haspopup="dialog"><img src="./photos/QAT_1527.jpeg" alt="Фотография 4" width="2856" height="4288" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/QAT_1646.jpeg" aria-label="Открыть фотографию 5" aria-haspopup="dialog"><img src="./photos/QAT_1646.jpeg" alt="Фотография 5" width="4032" height="6048" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/QAT_1687.jpeg" aria-label="Открыть фотографию 6" aria-haspopup="dialog"><img src="./photos/QAT_1687.jpeg" alt="Фотография 6" width="2656" height="3984" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/instagram-DdumBs5CF5J-01.jpg" aria-label="Открыть фотографию 7" aria-haspopup="dialog"><img src="./photos/instagram-DdumBs5CF5J-01.jpg" alt="Фотография 7" width="3072" height="4096" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/instagram-DfaA3LsCNP_-01.jpg" aria-label="Открыть фотографию 8" aria-haspopup="dialog"><img src="./photos/instagram-DfaA3LsCNP_-01.jpg" alt="Фотография 8" width="4096" height="2731" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/instagram-DfaA3LsCNP_-02.jpg" aria-label="Открыть фотографию 9" aria-haspopup="dialog"><img src="./photos/instagram-DfaA3LsCNP_-02.jpg" alt="Фотография 9" width="4096" height="2731" loading="lazy" decoding="async"></a>
        <a class="frame" href="./photos/instagram-DfaA3LsCNP_-03.jpg" aria-label="Открыть фотографию 10" aria-haspopup="dialog"><img src="./photos/instagram-DfaA3LsCNP_-03.jpg" alt="Фотография 10" width="4096" height="2731" loading="lazy" decoding="async"></a>
      </div>
    </div>
  </main>
  <dialog class="album" id="album" aria-label="Просмотр фотоальбома">
    <div class="album-stage" id="album-stage">
      <figure class="album-glass">
        <img class="album-photo" id="album-photo" alt="" draggable="false">
      </figure>
    </div>
    <button class="album-control album-close" type="button" aria-label="Закрыть просмотр" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <button class="album-control album-prev" type="button" aria-label="Предыдущее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
    <button class="album-control album-next" type="button" aria-label="Следующее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
  </dialog>
  <script>
    const gallery = document.querySelector('.gallery');
    const viewButtons = [...document.querySelectorAll('.view-button')];
    function setGalleryView(view) {
      const selected = view === 'squares' ? 'squares' : 'original';
      gallery.dataset.view = selected;
      viewButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === selected)));
      try { localStorage.setItem('perova-gallery-view', selected); } catch {}
    }
    let savedView = 'original';
    try { savedView = localStorage.getItem('perova-gallery-view') || 'original'; } catch {}
    setGalleryView(savedView);
    viewButtons.forEach(button => button.addEventListener('click', () => setGalleryView(button.dataset.view)));
    const frames = [...document.querySelectorAll('.frame')];
    const album = document.getElementById('album');
    const photo = document.getElementById('album-photo');
    const stage = document.getElementById('album-stage');
    let current = 0;
    let origin = null;
    let touchStart = null;
    function showPhoto(index) {
      current = (index + frames.length) % frames.length;
      const frame = frames[current];
      photo.src = frame.href;
      photo.alt = frame.querySelector('img').alt;
      album.setAttribute('aria-label', 'Фотография ' + (current + 1) + ' из ' + frames.length);
    }
    frames.forEach((frame, index) => frame.addEventListener('click', event => {
      event.preventDefault();
      origin = frame;
      showPhoto(index);
      album.showModal();
      document.documentElement.classList.add('album-open');
    }));
    album.querySelector('.album-close').addEventListener('click', () => album.close());
    album.querySelector('.album-prev').addEventListener('click', () => showPhoto(current - 1));
    album.querySelector('.album-next').addEventListener('click', () => showPhoto(current + 1));
    album.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        showPhoto(current + (event.key === 'ArrowRight' ? 1 : -1));
      }
    });
    album.addEventListener('close', () => {
      document.documentElement.classList.remove('album-open');
      touchStart = null;
      if (origin) origin.focus({ preventScroll: true });
    });
    stage.addEventListener('click', event => {
      if (event.target === stage) album.close();
    });
    stage.addEventListener('touchstart', event => {
      touchStart = event.touches.length === 1
        ? { x: event.touches[0].clientX, y: event.touches[0].clientY }
        : null;
    }, { passive: true });
    stage.addEventListener('touchend', event => {
      if (!touchStart || event.touches.length || !event.changedTouches.length) return;
      const dx = event.changedTouches[0].clientX - touchStart.x;
      const dy = event.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        showPhoto(current + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });
    stage.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });
  </script>
</body>
</html>
